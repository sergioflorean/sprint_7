<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de superhéroes</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="form-container">
      <h1 class="form-container__title">
        ¡Sé un nuevo superhéroe en nuestro equipo!
      </h1>
      <form class="form" name="superHeroe">
        <label class="form__label" for="nombre">Nombre del superhéroe</label>
        <input
          type="text"
          class="form__input"
          placeholder="Introduce tu nombre de superhéroe"
          id="nombre"
          name="nombre"
          required
        />
        <span class="nombre-input-error form__input-error"></span>

        <label class="form__label" for="nivel">Nivel de poder</label>
        <input
          type="number"
          class="form__input"
          min="1"
          max="10"
          placeholder="Ingresa tu nivel de poder del 1 al 10"
          id="nivel"
          name="nivel"
          required
        />
        <span class="nivel-input-error form__input-error"></span>

        <label class="form__label" for="correoElectrónico"
          >Correo electrónico</label
        >
        <input
          type="text"
          class="form__input"
          placeholder="Introduce tu correo electrónico"
          id="correoElectrónico"
          name="correoElectrónico"
          required
        />
        <span class="correoElectrónico-input-error form__input-error"></span>
        <label class="form__label" for="contraseña">Contraseña</label>
        <input
          type="password"
          class="form__input"
          minlength="6"
          maxlength="8"
          placeholder="Introduce tu contraseña"
          id="contraseña"
          name="contraseña"
          required
        />
        <span class="contraseña-input-error form__input-error"></span>
        <label class="form__label" for="fechaDeNacimiento"
          >Fecha de nacimiento</label
        >
        <input
          type="date"
          class="form__input"
          id="fechaDeNacimiento"
          name="fechaDeNacimiento"
          required
        />
        <span class="fechaDeNacimiento-input-error form__input-error"></span>

        <label class="form__label" for="superpoderes"
          >Lista de superpoderes</label
        >
        <textarea
          rows="4"
          cols="50"
          placeholder="Escribe aquí tus superpoderes"
          minlength="10"
          class="form__textarea"
          id="superpoderes"
          name="superpoderes"
          required
        ></textarea>
        <span class="superpoderes-input-error form__input-error"></span>

        <label class="form__label">
          ¿Con cuál universo de super herores te identificas?
        </label>
        <label class="form__label" for="universo1">
          <input
            type="radio"
            value="DC"
            id="universo1"
            name="universo"
            required
          />
          DC
        </label>
        <label class="form__label" for="universo2">
          <input
            type="radio"
            value="Marvel"
            id="universo2"
            name="universo"
            required
          />
          Marvel
        </label>
        <span class="universo-input-error form__input-error"></span>
        <label class="form__label" for="fortaleza"
          >¿Cuál es tu mayor fortaleza como superhéroe?</label
        >
        <select class="form__select" id="fortaleza" name="fortaleza" required>
          <option value="Liderazgo" selected>El liderazgo</option>
          <option value="Lucha">La lucha</option>
          <option value="Inteligencia">La inteligencia</option>
        </select>
        <div class="form__buttons">
          <button
            class="form__button form__button--reset"
            type="reset"
            name="limpiar"
          >
            Limpiar
          </button>
          <button
            class="form__button form__button--submit"
            type="submit"
            name="enviar"
            disabled
          >
            Registrar
          </button>
        </div>
      </form>
    </div>
    <script src="index.js"></script>
  </body>
</html>
