<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="lista">
      <h1>Lista de Películas</h1>
      <ul id="peliculas">
        <!-- Las películas se agregarán aquí -->
      </ul>
      <button class="ordenarButton" id="ordenar-button">
        Ordenar por puntuacion
      </button>
      <template class="peliculaTemplate" id="peliculaTemplate">
        <li>
          <p class="title"></p>
          <p class="genre"></p>
          <p class="year"></p>
          <p class="rating"></p>
        </li>
      </template>
    </div>
  </body>
  <script src="index.js"></script>
</html>
